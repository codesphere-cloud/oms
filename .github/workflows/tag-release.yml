name: Tag

on:
  push:
    branches:
      - main

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  integration-tests:
    uses: ./.github/workflows/integration-test.yml
    secrets: inherit

  build-oms:
    name: Build OMS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: 'go.mod'

      # The bootstrap runner is linux/amd64, like this one.
      - name: Build CLI
        run: |
          make build-cli
          ./oms version

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: oms
          path: oms
          if-no-files-found: error
          retention-days: 1

  # Bootstraps the latest official Codesphere release on GCP with this commit's OMS build,
  # so a broken bootstrap blocks the release instead of surfacing in the monorepo.
  bootstrap-gcp:
    needs: build-oms
    uses: ./.github/workflows/bootstrap-gcp.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      oms-artifact: oms
      name: main
      datacenter-name: oms-main
      root-disk-size: '200'
      github-team-org: codesphere-cloud
      github-team-slug: dev

  notify-bootstrap-gcp:
    name: Notify on bootstrap failure
    needs: bootstrap-gcp
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Slack Notification on Failure
        uses: ./.github/actions/slack-notify
        with:
          job-name: Bootstrap GCP (${{ needs.bootstrap-gcp.outputs.install-version }}, OMS from source${{ needs.bootstrap-gcp.outputs.failure-stage && format(', failed at {0}', needs.bootstrap-gcp.outputs.failure-stage) || '' }})
          webhook: ${{ secrets.PACKAGE_JOB_SLACK_WEBHOOK }}

  tag:
    runs-on: ubuntu-latest
    needs: [integration-tests, bootstrap-gcp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: 'go.mod'

      - name: Tag
        run: hack/tag-release.sh
        env:
          # PAT-published releases trigger the CLI reference release workflow.
          GITHUB_TOKEN: ${{ secrets.PAT_UPDATE_DOCS }}

      - name: Slack Notification on Failure
        if: ${{ failure() }}
        run: |
          curl -X POST \
            -H 'Content-type: application/json' \
            --data '{
              "channel": "#team-oms-sdk",
              "icon_emoji": ":siren:",
              "text": "🚨 Release Job Failure 🚨\nRepository: ${{ github.repository }}\nBranch/Ref: `${{ github.ref }}`\nRun url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' \
            ${{ secrets.PACKAGE_JOB_SLACK_WEBHOOK }}
