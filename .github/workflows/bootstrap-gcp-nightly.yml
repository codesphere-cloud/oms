# Nightly check of the latest OMS release against the latest official Codesphere release,
# airgapped on RHEL.
name: Bootstrap GCP Nightly

on:
  schedule:
    - cron: "0 2 * * *"

jobs:
  bootstrap-gcp:
    uses: ./.github/workflows/bootstrap-gcp-oms.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      name: nightly
      oms-version: latest
      airgapped: true
      os: rhel-9
      notify: true
