# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Build & Test CLI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build-test:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: build
            label: build
          - task: test
            label: test
          - task: install-config
            label: install-config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'

      - name: Build CLI
        if: ${{ matrix.task == 'build' || matrix.task == 'install-config' }}
        run: make build-cli

      - name: Test
        if: ${{ matrix.task == 'test' }}
        run: make test

      - name: Setup SOPS and age for vault encryption
        if: ${{ matrix.task == 'install-config' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          # sops is not packaged in Ubuntu's repos, so fetch the pinned release binary.
          curl -fsSL -o /tmp/sops \
            https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          age-keygen -o age_key.txt
          echo "SOPS_AGE_KEY_FILE=${GITHUB_WORKSPACE}/age_key.txt" >> "$GITHUB_ENV"

      - name: Generate and validate install configs
        if: ${{ matrix.task == 'install-config' }}
        run: |
          set -euo pipefail
          for profile in dev minimal production; do
            echo "==> Generating install config for profile: ${profile}"
            ./oms init install-config \
              --profile "${profile}" \
              --interactive=false \
              -c "config-${profile}.yaml" \
              --vault "prod-${profile}.vault.yaml"

            echo "==> Validating generated install config for profile: ${profile}"
            # Validate the config only. The generated vault is SOPS-encrypted and
            # its contents are covered by the round-trip unit tests, so this step
            # stays focused on the config (--vault "" skips vault loading).
            ./oms init install-config \
              --validate \
              -c "config-${profile}.yaml" \
              --vault ""
          done

      - name: Generate an install config without an age key
        if: ${{ matrix.task == 'install-config' }}
        env:
          SOPS_AGE_KEY_FILE: ""
        run: |
          set -euo pipefail
          ./oms init install-config \
            --profile dev \
            --interactive=false \
            -c config-generated-key.yaml \
            --vault prod-generated-key.vault.yaml 2>&1 | tee generate.log

          if ! grep -q 'ENC\[' prod-generated-key.vault.yaml; then
            echo "expected a SOPS-encrypted vault encrypted with a generated age key" >&2
            exit 1
          fi

          grep -E '^(# public key: |AGE-SECRET-KEY-)' generate.log > generated_age_key.txt
          if ! grep -q '^AGE-SECRET-KEY-' generated_age_key.txt; then
            echo "expected the generated age key to be printed" >&2
            exit 1
          fi

          if ! ./oms init install-config \
            --validate \
            --age-key generated_age_key.txt \
            -c config-generated-key.yaml \
            --vault prod-generated-key.vault.yaml 2>&1 | tee validate.log; then
            echo "expected the vault to be decryptable with the printed age key" >&2
            exit 1
          fi

          if ! grep -q 'Configuration is valid!' validate.log; then
            echo "expected validation to succeed with the printed age key" >&2
            exit 1
          fi

      - name: Slack Notification on Failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/slack-notify
        with:
          job-name: ${{ matrix.label }}
          webhook: ${{ secrets.PACKAGE_JOB_SLACK_WEBHOOK }}
