# Temporary: tries the shared bootstrap from codesphere-cloud/gh-actions before replacing bootstrap-gcp.yml.
name: Try shared Bootstrap GCP

on:
  pull_request:
    paths:
      - .github/workflows/try-shared-bootstrap-gcp.yml

permissions:
  contents: read

jobs:
  build:
    name: Build OMS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: |
          make build-cli
          ./oms version
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: oms
          path: oms
          if-no-files-found: error
          retention-days: 1

  bootstrap:
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: codesphere-cloud/gh-actions/.github/workflows/bootstrap-gcp.yml@oliver/reusable-gcp-bootstrap-flow
    with:
      oms-artifact: oms
      # Not oms-main-*, so it can't clash with a release run's project.
      name: oms-gha-${{ github.run_number }}
      datacenter-name: oms-gha-test
      ttl: 2h
    secrets:
      OMS_INFRA_WIF_PROVIDER: ${{ secrets.OMS_INFRA_WIF_PROVIDER }}
      OMS_INFRA_WIF_SA: ${{ secrets.OMS_INFRA_WIF_SA }}
      PC_INSTALLER_TEST_GCP_FOLDER: ${{ secrets.PC_INSTALLER_TEST_GCP_FOLDER }}
      PC_INSTALLER_TEST_GCP_BILLING_ACCOUNT: ${{ secrets.PC_INSTALLER_TEST_GCP_BILLING_ACCOUNT }}
      PC_INSTALLER_TEST_GCP_SSH_KEY_PRIVATE: ${{ secrets.PC_INSTALLER_TEST_GCP_SSH_KEY_PRIVATE }}
      PC_INSTALLER_TEST_GCP_SSH_KEY_PUBLIC: ${{ secrets.PC_INSTALLER_TEST_GCP_SSH_KEY_PUBLIC }}
      PC_INSTALLER_TEST_OMS_PORTAL_API_KEY: ${{ secrets.PC_INSTALLER_TEST_OMS_PORTAL_API_KEY }}
      PC_INSTALLER_TEST_GCP_OPENBAO_PASSWORD: ${{ secrets.PC_INSTALLER_TEST_GCP_OPENBAO_PASSWORD }}
      PC_INSTALLER_TEST_GCP_TEST_USER_PASSWORD: ${{ secrets.OMS_CS_TEST_USER_PASSWORD }}
      PC_INSTALLER_TEST_GCP_TEST_USER_PASSWORD_HASHED: ${{ secrets.OMS_CS_TEST_USER_PASSWORD_HASHED }}
      PC_INSTALLER_TEST_GCP_GITHUB_APP_NAME: ${{ secrets.PC_INSTALLER_TEST_GCP_GITHUB_APP_NAME }}
      PC_INSTALLER_TEST_GCP_GITHUB_APP_CLIENT_ID: ${{ secrets.PC_INSTALLER_TEST_GCP_GITHUB_APP_CLIENT_ID }}
      PC_INSTALLER_TEST_GCP_GITHUB_APP_CLIENT_SECRET: ${{ secrets.PC_INSTALLER_TEST_GCP_GITHUB_APP_CLIENT_SECRET }}
      PC_INSTALLER_TEST_GCP_GITLAB_APP_CLIENT_ID: ${{ secrets.PC_INSTALLER_TEST_GCP_GITLAB_APP_CLIENT_ID }}
      PC_INSTALLER_TEST_GCP_GITLAB_APP_CLIENT_SECRET: ${{ secrets.PC_INSTALLER_TEST_GCP_GITLAB_APP_CLIENT_SECRET }}
      PC_INSTALLER_TEST_GCP_BITBUCKET_APP_CLIENT_ID: ${{ secrets.PC_INSTALLER_TEST_GCP_BITBUCKET_APP_CLIENT_ID }}
      PC_INSTALLER_TEST_GCP_BITBUCKET_APP_CLIENT_SECRET: ${{ secrets.PC_INSTALLER_TEST_GCP_BITBUCKET_APP_CLIENT_SECRET }}
      PC_INSTALLER_TEST_GCP_AZURE_DEVOPS_APP_CLIENT_ID: ${{ secrets.PC_INSTALLER_TEST_GCP_AZURE_DEVOPS_APP_CLIENT_ID }}
      PC_INSTALLER_TEST_GCP_AZURE_DEVOPS_APP_CLIENT_SECRET: ${{ secrets.PC_INSTALLER_TEST_GCP_AZURE_DEVOPS_APP_CLIENT_SECRET }}
      PC_INSTALLER_TEST_GCP_REGISTRY_USER: ${{ secrets.PC_INSTALLER_TEST_GCP_REGISTRY_USER }}
      PC_INSTALLER_TEST_GCP_REGISTRY_PAT: ${{ secrets.PC_INSTALLER_TEST_GCP_REGISTRY_PAT }}
      PC_INSTALLER_TEST_GCP_OIDC_CLIENT_ID: ${{ secrets.PC_INSTALLER_TEST_GCP_OIDC_CLIENT_ID }}
      PC_INSTALLER_TEST_GCP_OIDC_CLIENT_SECRET: ${{ secrets.PC_INSTALLER_TEST_GCP_OIDC_CLIENT_SECRET }}
      PC_INSTALLER_TEST_GCP_EXTERNAL_LOKI_SECRET: ${{ secrets.PC_INSTALLER_TEST_GCP_EXTERNAL_LOKI_SECRET }}
      CENTRAL_OTEL_USERNAME: ${{ secrets.CENTRAL_OTEL_USERNAME }}
      CENTRAL_OTEL_PASSWORD: ${{ secrets.CENTRAL_OTEL_PASSWORD }}
      PROMETHEUS_REMOTE_WRITE_USERNAME: ${{ secrets.PROMETHEUS_REMOTE_WRITE_USERNAME }}
      PROMETHEUS_REMOTE_WRITE_PASSWORD: ${{ secrets.PROMETHEUS_REMOTE_WRITE_PASSWORD }}

  report:
    needs: bootstrap
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          OUT: ${{ toJSON(needs.bootstrap.outputs) }}
        run: echo "$OUT"
