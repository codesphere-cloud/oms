# Runs the GCP bootstrap on demand, and on pull requests that either change the bootstrap
# workflows (so they are tested before they can block a release) or carry the ci-pc-deploy label.
name: Bootstrap GCP Testing

on:
  # No paths filter: it would also apply to the labeled event, so the changed files are
  # checked in the changes job instead.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      oms_version:
        description: OMS version to run. Empty builds it from the selected branch, "latest" uses the latest OMS release, or a release tag (e.g. v5.43.0).
        type: string
        default: ""
      install_version:
        description: Codesphere version to install (e.g. codesphere-v1.2.3). Defaults to the latest official release.
        type: string
        default: ""
      airgapped:
        description: Bootstrap an airgapped installation (--airgapped).
        type: boolean
        default: false
      rhel:
        description: Boot all VMs with RHEL 9 instead of Ubuntu (--os=rhel-9).
        type: boolean
        default: false
      prevent_destroy:
        description: Keep the GCP project after the run for debugging.
        type: boolean
        default: false
      ttl:
        description: Project TTL; expired projects are deleted by the monorepo's cleanup cron.
        type: string
        default: 2h

jobs:
  changes:
    name: Check for bootstrap workflow changes
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Check changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          FILES=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
          if grep -qxE '\.github/workflows/bootstrap-gcp[a-z-]*\.yml' <<< "$FILES"; then
            echo "workflows=true" >> "$GITHUB_OUTPUT"
          else
            echo "workflows=false" >> "$GITHUB_OUTPUT"
          fi

  bootstrap-gcp:
    needs: changes
    # always() because changes is skipped for workflow_dispatch and labeled events.
    # Adding another label must not re-run the bootstrap; adding ci-pc-deploy runs it once,
    # and every later push to a labeled PR runs it again.
    if: >-
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event.action == 'labeled' && github.event.label.name == 'ci-pc-deploy') ||
        (github.event.action != 'labeled' && (
          contains(github.event.pull_request.labels.*.name, 'ci-pc-deploy') ||
          needs.changes.outputs.workflows == 'true'
        ))
      )
    uses: ./.github/workflows/bootstrap-gcp.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    # pull_request runs have no inputs: empty strings need no fallback, booleans and ttl do.
    with:
      # head_ref is the PR branch; ref_name the branch selected for workflow_dispatch.
      project_prefix: ${{ github.head_ref || github.ref_name }}
      oms_version: ${{ inputs.oms_version }}
      install_version: ${{ inputs.install_version }}
      airgapped: ${{ inputs.airgapped || true }}
      rhel: ${{ inputs.rhel || false }}
      prevent_destroy: ${{ inputs.prevent_destroy || true }}
      ttl: ${{ inputs.ttl || '2h' }}
