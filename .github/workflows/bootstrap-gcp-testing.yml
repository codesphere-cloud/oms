# Runs the GCP bootstrap on demand, and on pull requests that either change the bootstrap
# workflows (so they are tested before they can block a release) or carry the ci-pc-deploy label.
name: Bootstrap GCP Testing

on:
  # No paths filter: it would also apply to the labeled event, so the changed files are
  # checked in the changes job instead.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      oms_version:
        description: OMS version to run. Empty builds it from the selected branch, "latest" uses the latest OMS release, or a release tag (e.g. v5.43.0).
        type: string
        default: ""
      install_version:
        description: Codesphere version to install (e.g. codesphere-v1.2.3). Defaults to the latest official release.
        type: string
        default: ""
      airgapped:
        description: Bootstrap an airgapped installation (--airgapped).
        type: boolean
        default: false
      rhel:
        description: Boot all VMs with RHEL 9 instead of Ubuntu (--os=rhel-9).
        type: boolean
        default: false
      prevent_destroy:
        description: Keep the GCP project after the run for debugging.
        type: boolean
        default: false
      ttl:
        description: Project TTL; expired projects are deleted by the monorepo's cleanup cron.
        type: string
        default: 2h

jobs:
  changes:
    name: Check for bootstrap workflow changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Check changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          FILES=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
          if grep -qxE '\.github/workflows/bootstrap-gcp[a-z-]*\.yml' <<< "$FILES"; then
            echo "workflows=true" >> "$GITHUB_OUTPUT"
          else
            echo "workflows=false" >> "$GITHUB_OUTPUT"
          fi

  # Builds OMS from source unless a release was asked for. Carries the condition for the
  # bootstrap, so the bootstrap only has to check that this job succeeded.
  build-oms:
    name: Build OMS
    needs: changes
    # !cancelled() because changes is skipped for workflow_dispatch; unlike always(), it does
    # not start the bootstrap after the run was cancelled.
    # Each PR action starts at most one bootstrap. A PR created with ci-pc-deploy fires both
    # opened and labeled, so opened ignores the label and labeled skips PRs changing the
    # workflows, which already bootstrap on opened and every push. Adding another label
    # never runs it.
    if: >-
      !cancelled() && !inputs.oms_version && (
        github.event_name == 'workflow_dispatch' ||
        (github.event.action == 'opened' && needs.changes.outputs.workflows == 'true') ||
        (github.event.action == 'labeled' && github.event.label.name == 'ci-pc-deploy' &&
          needs.changes.outputs.workflows == 'false') ||
        ((github.event.action == 'synchronize' || github.event.action == 'reopened') && (
          contains(github.event.pull_request.labels.*.name, 'ci-pc-deploy') ||
          needs.changes.outputs.workflows == 'true'
        ))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'

      # The bootstrap runner is linux/amd64, like this one.
      - name: Build CLI
        run: |
          make build-cli
          ./oms version

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: oms
          path: oms
          if-no-files-found: error
          retention-days: 1

  bootstrap-gcp:
    needs: build-oms
    # A manual run with an OMS release skips the build.
    if: >-
      !cancelled() && (
        needs.build-oms.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.oms_version != '')
      )
    uses: ./.github/workflows/bootstrap-gcp.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    # pull_request runs have no inputs, so they get the defaults after the ||. Booleans that
    # default to true on pull requests can't use ||, since false || true is true.
    with:
      name: ${{ github.head_ref || github.ref_name }}
      datacenter-name: oms-main
      oms-artifact: ${{ !inputs.oms_version && 'oms' || '' }}
      # The shared workflow takes an empty version as the latest release.
      oms-version: ${{ inputs.oms_version != 'latest' && inputs.oms_version || '' }}
      install-version: ${{ inputs.install_version || '' }}
      airgapped: ${{ github.event_name == 'pull_request' || inputs.airgapped }}
      os: ${{ inputs.rhel && 'rhel-9' || 'ubuntu' }}
      prevent-destroy: ${{ github.event_name == 'pull_request' || inputs.prevent_destroy }}
      ttl: ${{ inputs.ttl || '2h' }}
      root-disk-size: '200'
      github-team-org: codesphere-cloud
      github-team-slug: dev
