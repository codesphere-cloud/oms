all: false
dir: "{{.InterfaceDir}}"
force-file-write: true
filename: "mocks.go"
formatter: gofmt
log-level: info
structname: "{{.Mock}}{{.InterfaceName}}"
pkgname: "{{.SrcPackageName}}"
recursive: true
require-template-schema-exists: true
template: testify
template-schema: "{{.Template}}.schema.json"
packages:
  github.com/codesphere-cloud/oms/internal:
  github.com/codesphere-cloud/oms/pkg:
  github.com/codesphere-cloud/oms/cli/cmd:
  net/http:
    config:
      dir: internal/installer
      filename: mock_registry_handler_test.go
      pkgname: installer_test
    interfaces:
      Handler:
        config:
          structname: MockRegistryHandler
  sigs.k8s.io/controller-runtime/pkg/client:
    config:
      dir: internal/installer/argocd
      filename: mock_client_test.go
      pkgname: argocd_test
    interfaces:
      Client:
        config:
          structname: MockClient
