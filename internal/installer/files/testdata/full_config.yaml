dataCenter:
  id: 1
  name: main
  city: Karlsruhe
  countryCode: DE
dataCenters:
  - id: 1
    name: main
    city: Karlsruhe
    countryCode: DE
  - id: 2
    name: second
    city: Frankfurt
    countryCode: DE
defaultDataCenterId: 2
secrets:
  baseDir: /etc/codesphere/secrets
registry:
  server: registry.example.com
  replaceImagesInBom: false
  loadContainerImages: true
postgres:
  caCertPem: ca-pem
  serverAddress: postgres.example.com
  altName: postgres-rw.codesphere.svc
  port: 5433
  useSsl: false
  database: masterdata
  rolesPrefix: cs_
ceph:
  csiKubeletDir: /var/lib/k0s/kubelet
  cephAdmSshKey:
    publicKey: ssh-ed25519 AAAA
  nodesSubnet: 10.0.0.0/24
  hosts:
    - hostname: ceph-1
      ipAddress: 10.0.0.10
      isMaster: true
  osds:
    - specId: default
      placement:
        host_pattern: "*"
        hosts:
          - ceph-1
      dataDevices:
        model: SAMSUNG
        size: "100G:"
        limit: 4
      dbDevices:
        size: ":50G"
      blockDbSize: 100G
      osdsPerDevice: 2
  volumes:
    codesphere:
      mds:
        count: 4
        active: 3
      secret: cephfsAdminCodesphere
  rbdPoolName: rbd-pool
  expectedOsdCount: 6
kubernetes:
  managedByCodesphere: true
  apiServerHost: apiserver.example.com
  controlPlanes:
    - ipAddress: 10.0.0.20
  workers:
    - ipAddress: 10.0.0.21
  podCidr: 100.96.0.0/11
  serviceCidr: 100.64.0.0/13
  oidc:
    issuerUrl: https://dex.example.com
    clientId: kube
    usernameClaim: preferred_username
    groupsClaim: roles
cluster:
  certificates:
    ca:
      algorithm: RSA
      keySizeBits: 2048
      certPem: cert-pem
    override:
      issuers:
        acme:
          solverSecret: acme-secret
  gateway:
    gatewayApi:
      enabled: true
      use: false
    nodeSelector:
      role: gateway
    serviceType: LoadBalancer
    annotations:
      lb.example.com/class: internal
    ipAddresses:
      - 203.0.113.11
    override:
      replicaCount: 2
  publicGateway:
    gatewayApi:
      enabled: false
    serviceType: NodePort
  metallb:
    enabled: true
    pools:
      - name: public
        ipAddresses:
          - 203.0.113.0/28
    l2:
      - name: public-l2
        pools:
          - public
        nodeSelectors:
          - matchLabels:
              role: gateway
    bgp:
      - name: public-bgp
        pools:
          - public
        config:
          myASN: 64500
          peerASN: 64501
          peerAddress: 10.0.0.1
          bfdProfile: fast
        nodeSelectors:
          - matchLabels:
              role: edge
    override:
      speaker:
        logLevel: debug
codesphere:
  domain: codesphere.example.com
  workspaceHostingBaseDomain: ws.example.com
  publicIp: 203.0.113.10
  branding:
    desc: Cloud IDE
    docsUrl: https://docs.example.com
    faviconHref: https://example.com/favicon.ico
    showOnboarding: true
    title: Example IDE
    tosUrl: https://example.com/tos
  certIssuer:
    type: acme
    acme:
      enabled: true
      email: ops@example.com
      server: https://acme.example.com/directory
      eabKeyId: eab-key
      customDomainsEabKeyId: custom-eab-key
  customCertificate:
    cert: cert-pem
    key: key-pem
  workspaceHostingCustomCertificate:
    cert: ws-cert-pem
    key: ws-key-pem
  sshWorkspaceProxy:
    baseDomain: ssh.example.com
  vpnLeftPeerId: peer-1
  customDomains:
    cNameBaseDomain: custom.example.com
    insecureSkipDomainControlVerify: true
    cert:
      algorithm: ECDSA
      size: 256
  dnsServers:
    - 1.1.1.1
  experiments:
    - legacy-experiment
  internal:
    - internal-flag
  preview:
    preview-flag: true
  features:
    feature-flag: false
  clusterAdminEmail: admin@example.com
  extraCaPem: extra-ca-pem
  extraWorkspaceEnvVars:
    FOO: bar
  extraWorkspaceFiles:
    - name: .npmrc
      content: cmVnaXN0cnk=
      encoded: true
  workspaceImages:
    agent:
      bomRef: workspace-agent-24.04
      dockerfile: Dockerfile.agent
    agentGpu: registry.example.com/agent-gpu:1
    server:
      bomRef: workspace-server
    vpn:
      bomRef: vpn
  deployConfig:
    images:
      ubuntu-24.04:
        name: Ubuntu 24.04
        supportedUntil: "2029-04-01"
        default: true
        flavors:
          default:
            image:
              bomRef: workspace-agent-24.04
            pool:
              8: 2
  prePullImages: false
  ipService:
    loadBalancerKind: metallb
    addressPools:
      - public
  plans:
    hostingPlans:
      8:
        cpuTenth: 10
        gpuParts: 0
        memoryMb: 2048
        storageMb: 20480
        tempStorageMb: 1500
        pooledInstances: 2
    workspacePlans:
      20:
        name: Micro
        priceUsd: 9.5
        deprecated: true
        hostingPlanId: 8
        maxReplicas: 3
        onDemand: true
  signUp:
    email:
      allowedDomains:
        - example.com
  email:
    provider: smtp
    smtp:
      host: smtp.example.com
      port: 587
      secure: true
      username: mailer
  underprovisionFactors:
    cpu: 0.5
    memory: 0.75
  gitProviders:
    github:
      enabled: true
      url: https://github.com
      api:
        baseUrl: https://api.github.com
      oauth:
        issuer: https://github.com
        authorizationEndpoint: https://github.com/login/oauth/authorize
        tokenEndpoint: https://github.com/login/oauth/access_token
        clientAuthMethod: client_secret_post
        scope: repo
        redirectUri: https://codesphere.example.com/ide/auth/github/callback
        installationUri: https://github.com/apps/codesphere/installations/new
    scmManager:
      enabled: true
      url: https://scm.example.com
      api:
        baseUrl: https://scm.example.com/api
  oauth:
    oidc:
      type: oidc
      enabled: true
      name: Dex
      issuerUrl: https://dex.example.com
      scopes:
        - openid
  managedServices:
    - name: postgres
      schemaVersion: v1
      scope: team
      teamSingleton: true
      documentationUrl: https://docs.example.com/postgres
      labels:
        - sql
      capabilities:
        backup: true
      backups:
        configSchema:
          type: object
        secretsSchema:
          type: object
      backend:
        api:
          endpoint: https://postgres-provider.example.com
      versions:
        1.0.0:
          ref: v1
      resourceParameters:
        storage: null
      plans:
        - id: 1
          description: Small
          name: small
          parameters:
            cpu: 1
  managedServiceWorkspacePlanId: 21
  openBao:
    engine: kv
    uri: https://bao.example.com
    user: codesphere
  openFga:
    deploy: false
    apiUrl: https://fga.example.com
    expose:
      enabled: true
      host: fga.example.com
  maintenanceMode: false
  skipDatabaseSetup: true
  migration:
    postgres:
      host: 10.0.0.25
      port: 30432
      database: masterdata
      altName: masterdata-rw
  releaseName: codesphere-dev
  telemetryExport:
    remoteEndpoint: https://otel.example.com
    remoteExport: true
    traces: true
    traceEndpoint: https://tempo.example.com
    spanMetrics: true
  override:
    global:
      replicaCount: 2
managedServiceBackends: {}
