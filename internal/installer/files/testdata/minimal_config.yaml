dataCenter:
  id: 1
  name: main
  city: Karlsruhe
  countryCode: DE
secrets:
  baseDir: /etc/codesphere/secrets
postgres:
  serverAddress: postgres.example.com
ceph:
  cephAdmSshKey:
    publicKey: ssh-ed25519 AAAA
  nodesSubnet: 10.0.0.0/24
  hosts:
    - hostname: ceph-1
      ipAddress: 10.0.0.10
      isMaster: true
  osds:
    - specId: default
      placement:
        host_pattern: "*"
      dataDevices:
        size: "100G:"
      dbDevices:
        size: ":50G"
kubernetes:
  managedByCodesphere: false
  podCidr: 100.96.0.0/11
  serviceCidr: 100.64.0.0/13
cluster:
  certificates:
    ca:
      algorithm: RSA
      keySizeBits: 2048
      certPem: cert-pem
  gateway:
    serviceType: LoadBalancer
  publicGateway:
    serviceType: LoadBalancer
codesphere:
  domain: codesphere.example.com
  workspaceHostingBaseDomain: ws.example.com
  publicIp: 203.0.113.10
  customDomains:
    cNameBaseDomain: custom.example.com
  internal: []
  preview: {}
  features: {}
  plans:
    hostingPlans: {}
    workspacePlans: {}
managedServiceBackends: {}
